# Dev environment for Superset fork testing
# This stack is completely independent from production
# Access Superset at http://localhost:18088

# version: "3.8"  # Removed - obsolete in newer docker compose

services:
  postgres_dev:
    image: postgres:13
    container_name: superset_dev_postgres
    environment:
      POSTGRES_USER: superset_dev
      POSTGRES_PASSWORD: superset_dev
      POSTGRES_DB: superset_dev
    ports:
      - "15432:5432"  # Different port to avoid conflict with production
    volumes:
      - ../postgres_data_dev:/var/lib/postgresql/data
    networks:
      - superset_dev_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_dev:
    image: redis:latest
    container_name: superset_dev_redis
    ports:
      - "16379:6379"  # Different port to avoid conflict with production
    networks:
      - superset_dev_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset_dev:
    # Option 1: Build from Dockerfile with ClickHouse and MSSQL drivers (recommended for dev)
    build:
      context: .
      dockerfile: Dockerfile-superset-dev
    
    # Option 2: Use image from GitLab CI/CD (without additional drivers)
    # image: gitlab.gdpgroup.ru:5050/gdpgroup/superset_4.1.4_fork:feature-mixed-chart-v2-dev
    
    # Option 3: Build locally from main Dockerfile (uncomment to use)
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    #   target: dev
    #   args:
    #     BUILD_TRANSLATIONS: "false"
    #     LOAD_EXAMPLES_DUCKDB: "false"
    #     INCLUDE_CHROMIUM: "false"
    
    container_name: superset_dev
    environment:
      - SUPERSET_WEBSERVER_PORT=8088
      - SECRET_KEY=dev-secret-key-change-me-in-production
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset_dev:superset_dev@postgres_dev:5432/superset_dev
      - RATELIMIT_STORAGE_URI=redis://redis_dev:6379/0
      - RUNNING_IN_DOCKER=true
      - FLASK_ENV=development
      - SUPERSET_ENV=development
      - SUPERSET_LOAD_EXAMPLES=yes
    ports:
      - "18088:8088"  # Dev Superset accessible at http://localhost:18088
    volumes:
      # Data persistence
      - ../superset_data_dev:/app/superset_home
      - ../superset_data_dev:/app/superset/outer_files
      # Configuration
      - ./superset_config_dev.py:/app/pythonpath/superset_config.py:ro
      # Optional: Mount code for hot-reload (uncomment if needed)
      # Note: This requires rebuilding frontend assets inside container
      # - ../superset:/app/superset:ro
      - ../superset-frontend:/app/superset-frontend:ro
    # Fix permissions for data directory
    user: "1000:1000"
    networks:
      - superset_dev_net
      - clhs_sandbox_click_network  # Connect to production network to access ClickHouse
    depends_on:
      postgres_dev:
        condition: service_healthy
      redis_dev:
        condition: service_healthy
    restart: unless-stopped
    command: superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger

networks:
  superset_dev_net:
    driver: bridge
  clhs_sandbox_click_network:
    external: true  # Use existing production network to access ClickHouse

volumes:
  postgres_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../postgres_data_dev

