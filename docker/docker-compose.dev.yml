# Dev environment for Superset fork testing
# This stack is completely independent from production
# Access Superset at http://localhost:18088

# version: "3.8"  # Removed - obsolete in newer docker compose

services:
  postgres_dev:
    image: postgres:13
    container_name: superset_dev_postgres
    environment:
      POSTGRES_USER: superset_dev
      POSTGRES_PASSWORD: superset_dev
      POSTGRES_DB: superset_dev
    ports:
      - "15432:5432"  # Different port to avoid conflict with production
    volumes:
      - ../postgres_data_dev:/var/lib/postgresql/data
    networks:
      - superset_dev_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_dev:
    image: redis:latest
    container_name: superset_dev_redis
    ports:
      - "16379:6379"  # Different port to avoid conflict with production
    networks:
      - superset_dev_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Базовый dev-образ из основного Dockerfile (без драйверов ClickHouse/MSSQL).
  # Собирать первым: docker-compose -f docker/docker-compose.dev.yml build superset_dev_base
  superset_dev_base:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
      args:
        BUILD_TRANSLATIONS: "false"
        LOAD_EXAMPLES_DUCKDB: "false"
        INCLUDE_CHROMIUM: "false"
        INCLUDE_FIREFOX: "false"
        DEV_MODE: "false"
    image: superset_dev_base:latest
    profiles:
      - build  # не запускаем при up, только для сборки

  superset_dev:
    # Образ с драйверами БД (ClickHouse, MSSQL, psycopg2) из Dockerfile-superset-dev.
    # Сборка: сначала build superset_dev_base, затем build superset_dev.
    build:
      context: ..
      dockerfile: docker/Dockerfile-superset-dev
      args:
        BASE_IMAGE: superset_dev_base:latest
    image: superset_dev:latest
    container_name: superset_dev
    environment:
      - SUPERSET_WEBSERVER_PORT=8088
      - SECRET_KEY=dev-secret-key-change-me-in-production
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset_dev:superset_dev@postgres_dev:5432/superset_dev
      - RATELIMIT_STORAGE_URI=redis://redis_dev:6379/0
      - RUNNING_IN_DOCKER=true
      - FLASK_ENV=development
      - SUPERSET_ENV=development
      - SUPERSET_LOAD_EXAMPLES=yes
      - SUPERSET_VERSION=0.0.89
    ports:
      - "18088:8088"  # Dev Superset accessible at http://localhost:18088
    volumes:
      # Data persistence
      - ../superset_data_dev:/app/superset_home
      - ../superset_data_dev:/app/superset/outer_files
      # Configuration
      - ./superset_config_dev.py:/app/pythonpath/superset_config.py:ro
      # Optional: Mount code for hot-reload (uncomment if needed)
      # Note: This requires rebuilding frontend assets inside container
      # - ../superset:/app/superset:ro
      # ВАЖНО: mount должен быть RW, иначе внутри контейнера нельзя пересобрать плагины/фронтенд
      # (plugins:build пишет в lib/esm, а build пишет в кэш внутри superset-frontend).
      - ../superset-frontend:/app/superset-frontend
      # Статика фронтенда: НЕ монтируем с хоста — иначе при несовпадении manifest.json и файлов
      # браузер получает 404 (HTML) вместо .js → MIME type error. Используем артефакты из образа.
      # Раскомментировать для hot-reload статики после локального npm run build:
      # - ../superset/static/assets:/app/.venv/lib/python3.11/site-packages/superset/static/assets:ro
      # - ../superset/static/assets:/app/superset/static/assets:ro
    networks:
      - superset_dev_net
      - clhs_sandbox_click_network  # Connect to production network to access ClickHouse
    depends_on:
      postgres_dev:
        condition: service_healthy
      redis_dev:
        condition: service_healthy
    restart: unless-stopped
    command: superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger

networks:
  superset_dev_net:
    driver: bridge
  clhs_sandbox_click_network:
    external: true  # Use existing production network to access ClickHouse

volumes:
  postgres_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../postgres_data_dev

